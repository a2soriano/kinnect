# Kinnect settings. Copy this file and name the copy kinnect.properties.
# Keep kinnect.properties next to pom.xml (when running from NetBeans) or next to kinnect.jar.
# This repository already includes a kinnect.properties for the online database.
# Without any kinnect.properties, Kinnect uses the XAMPP defaults below.

# On this computer (XAMPP or MySQL installed here):
db.url=jdbc:mysql://localhost:3306/kinnect?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
db.user=root
db.password=

# Online, everyone uses the same server. Replace the three lines above with your server's details, for example:
# db.url=jdbc:mysql://YOUR-SERVER-HOST:PORT/kinnect?createDatabaseIfNotExist=true&sslMode=REQUIRED
# db.user=YOUR-USER
# db.password=YOUR-PASSWORD

# Fill an empty database with the sample classes and groups (true or false)
demo.data=true
